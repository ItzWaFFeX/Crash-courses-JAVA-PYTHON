<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrightByte — Learn. Build. Level Up.</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%2334d399"/><path d="M18 5 8 18h6l-2 9 12-14h-7z" fill="white"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a1c; --card:#151233; --card2:#1c1743; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#eef0ff; --mut:#a4a9d0; --dim:#767bad;
  --blue:#5b8cff; --cyan:#2dd4bf; --purple:#a78bfa; --yellow:#fbbf24; --green:#34d399; --pink:#f472b6; --red:#fb7185;
  --grad:linear-gradient(135deg,#34d399,#0ea5e9);
  --gradXp:linear-gradient(90deg,#2dd4bf,#5b8cff);
  --gradFire:linear-gradient(90deg,#fb7185,#fbbf24);
  --gradGold:linear-gradient(135deg,#fbbf24,#fb923c);
  --r:18px; --shadow:0 14px 34px rgba(4,2,24,.45);
  --font:'Outfit',system-ui,sans-serif; --disp:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--txt);font-size:16.5px;line-height:1.6;min-height:100vh;
  background:radial-gradient(1100px 780px at 88% -12%,rgba(52,211,153,.14),transparent 60%),
             radial-gradient(900px 700px at -12% 22%,rgba(45,212,191,.10),transparent 55%),
             radial-gradient(800px 600px at 55% 115%,rgba(14,165,233,.10),transparent 60%),var(--bg);
  background-attachment:fixed;}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.2;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--txt)}
a{color:inherit;text-decoration:none}
svg{flex:none}
::selection{background:rgba(52,211,153,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a2456;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.reduced *{animation:none!important;transition:none!important}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)} .small{font-size:.85rem}
code.inl{font-family:var(--mono);font-size:.86em;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.25);padding:.08em .38em;border-radius:6px;color:#b8f5dd}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:600;border-radius:14px;
  padding:12px 22px;border:1px solid transparent;transition:transform .16s,box-shadow .2s,background .2s;position:relative;overflow:hidden;white-space:nowrap}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.95)}
.btn-pri{background:var(--grad);color:#04241a;box-shadow:0 8px 22px rgba(24,160,120,.35)}
.btn-pri:hover{box-shadow:0 12px 28px rgba(24,160,120,.5)}
.btn-soft{background:rgba(255,255,255,.07);border-color:var(--line)}
.btn-soft:hover{background:rgba(255,255,255,.11)}
.btn-grn{background:linear-gradient(135deg,#34d399,#14b8a6);color:#04271d;box-shadow:0 8px 22px rgba(52,211,153,.3)}
.btn-gold{background:var(--gradGold);color:#3d2500;box-shadow:0 8px 22px rgba(251,191,36,.28)}
.btn-danger{background:rgba(251,113,133,.12);color:var(--red);border-color:rgba(251,113,133,.35)}
.btn-sm{padding:8px 15px;font-size:.9rem;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chip.b{color:var(--blue);background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.3)}
.chip.g{color:var(--green);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3)}
.chip.y{color:var(--yellow);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
.chip.p{color:var(--purple);background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.3)}
.chip.k{color:var(--pink);background:rgba(244,114,182,.12);border-color:rgba(244,114,182,.3)}
.chip.c{color:var(--cyan);background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.lift{transition:transform .22s,box-shadow .22s,border-color .22s}
.lift:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(4,2,24,.6);border-color:var(--line2)}
.page{animation:pageIn .38s cubic-bezier(.22,.8,.35,1) both;max-width:1200px;margin:0 auto;padding:30px 34px 80px}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{margin-bottom:26px}
.ph h1{font-size:clamp(1.7rem,3vw,2.3rem)}
.ph p{color:var(--mut);margin-top:5px}
.pbar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--gradXp);width:0;transition:width .9s cubic-bezier(.25,.9,.3,1);position:relative}
.pbar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pbar.sm{height:7px}
.land-top{display:flex;align-items:center;justify-content:space-between;padding:20px 34px;max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.logo .mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px rgba(24,160,120,.4);flex:none;color:#04241a}
.hero{max-width:1240px;margin:0 auto;padding:46px 34px 30px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.6rem,5.4vw,4.2rem);line-height:1.06}
.hero h1 .hl{background:linear-gradient(100deg,#34d399,#2dd4bf 45%,#5b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:1.16rem;color:var(--mut);margin:20px 0 30px;max-width:34rem}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-meta{display:flex;gap:20px;margin-top:34px;color:var(--dim);font-size:.9rem;flex-wrap:wrap;align-items:center}
.hero-meta span{display:inline-flex;align-items:center;gap:7px}
.hero-meta svg{color:var(--green)}
.hero-vis{position:relative;perspective:1100px}
.ed-win{background:#12102e;border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 70px rgba(3,2,20,.65);overflow:hidden;transition:transform .25s ease-out;transform-style:preserve-3d}
.ed-win .bar{display:flex;align-items:center;gap:7px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.ed-win .dot{width:11px;height:11px;border-radius:50%}
.ed-win .ttl{margin-left:8px;font-family:var(--mono);font-size:.75rem;color:var(--dim)}
.ed-win pre{font-family:var(--mono);font-size:13.5px;line-height:1.75;padding:20px 22px;min-height:290px;white-space:pre-wrap;word-break:break-word}
.caret{display:inline-block;width:8px;height:1.15em;background:var(--cyan);vertical-align:text-bottom;animation:blink 1s steps(1) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
.f-chip{position:absolute;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:14px;font-family:var(--mono);font-weight:600;font-size:.85rem;
  background:rgba(22,18,51,.92);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(3,2,20,.6);animation:floaty 5.2s ease-in-out infinite;backdrop-filter:blur(6px);z-index:2}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.sec{max-width:1240px;margin:0 auto;padding:56px 34px}
.sec h2{font-size:clamp(1.6rem,3vw,2.2rem);text-align:center}
.sec .lead{text-align:center;color:var(--mut);margin:10px auto 40px;max-width:38rem}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.feat{padding:26px 22px;position:relative;overflow:hidden}
.feat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:.85}
.f-ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin-bottom:16px;color:#04241a}
.feat h3{font-size:1.12rem;margin-bottom:7px}
.feat p{color:var(--mut);font-size:.94rem}
.show-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:900px;margin:0 auto}
.contact-strip{max-width:1240px;margin:0 auto;padding:10px 34px 0}
.contact-inner{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px 22px;flex-wrap:wrap;text-align:center}
.cta-band{max-width:1240px;margin:26px auto 70px;padding:0 34px}
.cta-inner{border-radius:26px;padding:52px 40px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(140deg,#102a24,#123044 55%,#152045);border:1px solid var(--line2)}
.cta-inner h2{font-size:clamp(1.7rem,3.4vw,2.5rem)}
.cta-inner p{color:var(--mut);margin:12px 0 26px}
footer{border-top:1px solid var(--line);padding:26px 34px;text-align:center;color:var(--dim);font-size:.88rem}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:30px 20px}
.auth-card{width:100%;max-width:430px;padding:36px 34px;animation:pageIn .4s both}
.auth-card .logo{justify-content:center;margin-bottom:8px}
.auth-card h1{font-size:1.6rem;text-align:center;margin-bottom:4px}
.auth-card>.sub{text-align:center;color:var(--mut);font-size:.94rem;margin-bottom:26px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:.86rem;font-weight:600;color:var(--mut);margin-bottom:7px}
.fld input,.fld select,.fld textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
.fld select option{background:#1c1743}
.f-err{color:var(--red);font-size:.85rem;margin:-8px 0 14px;min-height:0}
.f-note{text-align:center;margin-top:18px;color:var(--mut);font-size:.9rem}
.f-note button{color:var(--green);font-weight:600}
.demo-box{margin-top:22px;padding:13px 16px;border-radius:12px;background:rgba(45,212,191,.07);border:1px dashed rgba(45,212,191,.35);font-size:.83rem;color:var(--mut)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:rgba(13,11,36,.72);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px 14px 16px;z-index:60}
.side .logo{padding:0 10px 20px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;color:var(--mut);font-weight:500;font-size:.95rem;transition:background .18s,color .18s;position:relative}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(52,211,153,.16),rgba(14,165,233,.10));color:#fff;font-weight:600}
.nav a.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3.5px;border-radius:4px;background:var(--grad)}
.nav .ic{width:22px;display:grid;place-items:center;flex:none}
.side-user{margin-top:14px;padding:13px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);cursor:pointer;transition:border-color .2s;display:block}
.side-user:hover{border-color:var(--line2)}
.su-top{display:flex;align-items:center;gap:10px}
.su-name{font-weight:600;font-size:.93rem;line-height:1.25}
.su-lvl{font-size:.76rem;color:var(--cyan);font-weight:600}
.su-xp{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin:8px 0 5px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:none;align-items:center;gap:12px;padding:13px 18px;background:rgba(11,10,28,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hud{display:flex;align-items:center;gap:9px}
.hud-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700;font-size:.86rem}
.flame{display:inline-grid;place-items:center;animation:flame .9s ease-in-out infinite;transform-origin:50% 90%;color:var(--yellow)}
@keyframes flame{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.18) rotate(3deg)}}
.avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#fff;flex:none}
.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.panel{padding:24px}
.wave-hi{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.wave-hi h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.cont-card{display:flex;flex-direction:column;gap:14px}
.cont-course{display:flex;gap:16px;align-items:center}
.c-ico{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:1.05rem;color:#04241a;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat-tile{padding:18px 20px;text-align:left}
.stat-tile .num{font-family:var(--disp);font-size:1.7rem;font-weight:700}
.stat-tile .lbl{font-size:.82rem;color:var(--mut);font-weight:500}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{--p:0;--c:#2dd4bf;width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.09) 0);transition:background .6s;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.ring .in{position:relative;text-align:center;line-height:1.15}
.ring .in b{font-family:var(--disp);font-size:1.5rem}
.ring .in span{display:block;font-size:.66rem;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.badge-strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px}
.mini-badge{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.mini-badge .b-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gradGold);color:#3d2500}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.wk-bars{display:flex;align-items:flex-end;gap:9px;height:110px;margin-top:14px}
.wk-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.wk-bar i{display:block;width:100%;max-width:34px;border-radius:7px 7px 4px 4px;background:var(--gradXp);min-height:5px;transition:height .8s cubic-bezier(.25,.9,.3,1);opacity:.9}
.wk-bar.today i{background:var(--gradGold)}
.wk-bar span{font-size:.7rem;color:var(--dim);font-weight:600}
.live-item{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.ccard{padding:24px;display:flex;flex-direction:column;gap:14px}
.ccard-top{display:flex;gap:15px;align-items:flex-start}
.ccard h3{font-size:1.22rem}
.ccard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ccard .pct-row{display:flex;justify-content:space-between;font-size:.86rem;color:var(--mut);font-weight:600}
.ccard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .big{color:var(--dim);margin-bottom:12px;display:grid;place-items:center}
.cd-hero{padding:28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.cd-hero .c-ico{width:76px;height:76px;border-radius:22px}
.cd-stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.cd-stats b{font-family:var(--disp);font-size:1.25rem;display:block}
.cd-stats span{font-size:.8rem;color:var(--mut)}
.mod-acc{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.mod-h{width:100%;display:flex;align-items:center;gap:16px;padding:19px 22px;transition:background .2s;cursor:pointer;user-select:none;flex-wrap:wrap}
.mod-h:hover{background:rgba(255,255,255,.035)}
.mod-num{font-family:var(--mono);font-weight:600;font-size:.8rem;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid var(--line);padding:6px 11px;border-radius:10px;flex:none}
.mod-h .tt{flex:1;min-width:0}
.mod-h .tt b{font-family:var(--disp);font-size:1.05rem;display:block}
.mod-h .tt span{font-size:.82rem;color:var(--mut)}
.mod-h .tt .pbar{margin-top:7px;max-width:230px}
.chev{transition:transform .3s;color:var(--dim)}
.mod-item.open>.mod-h .chev{transform:rotate(180deg)}
.mod-body{display:none;padding:6px 14px 16px;flex-direction:column;gap:6px}
.mod-item.open .mod-body{display:flex;animation:slideDown .3s ease both}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.lrow{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;transition:background .18s;font-size:.96rem;width:100%}
.lrow:hover{background:rgba(255,255,255,.05)}
.lrow .lx{margin-left:auto;font-size:.78rem;color:var(--dim);font-weight:600;flex:none}
.lrow .tag{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;flex:none}
.st-ic{width:26px;height:26px;flex:none;display:grid;place-items:center}
.st-done{color:var(--green)} .st-lock{color:var(--dim)} .st-cur{color:var(--cyan)}
.lrow.cur{background:linear-gradient(90deg,rgba(45,212,191,.13),rgba(91,140,255,.08));box-shadow:inset 0 0 0 1.5px rgba(45,212,191,.55);animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(45,212,191,.55)}50%{box-shadow:inset 0 0 0 1.5px rgba(45,212,191,.95),0 0 22px rgba(45,212,191,.22)}}
.lrow.locked{opacity:.5}
.lrow.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.req-banner{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 24px;text-align:center}
.cur-preview{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.lesson-grid{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:22px;align-items:start}
.lnav{position:sticky;top:22px;max-height:calc(100vh - 44px);overflow-y:auto;padding:16px 12px}
.lnav-t{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:0 8px 10px}
.lnav-mh{display:flex;flex-direction:column;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:.86rem}
.lnav-mh b{font-family:var(--mono);font-size:.68rem;color:var(--dim);letter-spacing:.08em}
.lnav-mh span{font-weight:600}
.lnav-mod .lnav-rows{display:none;padding:2px 0 6px}
.lnav-mod.open .lnav-rows{display:block}
.lnav-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:.87rem;color:var(--mut);transition:background .15s}
.lnav-row:hover{background:rgba(255,255,255,.05);color:var(--txt)}

async function loadCloudUser(id,email){
  const{data,error}=await sb.from('students').select('*').eq('id',id).maybeSingle();
  if(error)throw error;
  if(!data){ // safety net: recreate the profile if it is missing
    await sb.from('students').upsert(userToRow(makeUser({id,email:email||''})));
    return loadCloudUser(id,email);
  }
  const mine=rowToUser(data);
  const i=DB.users.findIndex(u=>u.id===id);
  if(i>=0)DB.users[i]=mine;else DB.users.push(mine);
}

async function persistUser(u){
  if(!cloudMode||!sb||!u)return;
  const row=userToRow(u);
  try{ // UPDATE first: admins writing other students' rows pass the
       // UPDATE policy, but upsert's hidden INSERT check rejects them.
    const rec={...row};delete rec.id;
    const{error}=await sb.from('students').update(rec).eq('id',u.id);
    if(error)throw error;
  }catch(e){ // fallback to upsert (covers self-writes and brand-new rows)
    try{await sb.from('students').upsert(row)}
    catch(e2){console.warn('sync failed:',e2.message)}
  }
}

/* ---------- course access control (admin approval required) ----------
   Access, requests and announcement-read state are stored inside the
   existing JSONB columns (user.extra and app_state.extra_mods under
   reserved "_"-prefixed keys) so NO database changes are needed. */
function getAccess(u){return (u.extra&&u.extra._access)||[]}
function hasAccess(u,cid){
  if(!u)return false;
  if(u.role==='admin')return true;
  if(getAccess(u).includes(cid))return true;
  return (u.done&&u.done[cid]||[]).length>0; /* progress already made keeps access */
}
function getReqs(u){return (u.extra&&u.extra._requests)||[]}
function requestAccess(u,cid){
  u.extra=u.extra||{};u.extra._requests=u.extra._requests||[];
  if(u.extra._requests.some(r=>r.course===cid))return 'pending';
  u.extra._requests.push({course:cid,at:Date.now()});
  save();if(cloudMode)persistUser(u);
  return 'sent';
}
function grantAccess(u,cid){
  u.extra=u.extra||{};u.extra._access=u.extra._access||[];
  if(!u.extra._access.includes(cid))u.extra._access.push(cid);
  u.extra._requests=(u.extra._requests||[]).filter(r=>r.course!==cid);
  save();persistUser(u);
}
function revokeAccess(u,cid){
  u.extra=u.extra||{};
  u.extra._access=(u.extra._access||[]).filter(x=>x!==cid);
  save();persistUser(u);
}
function announcements(){return (DB.extraMods&&DB.extraMods._announcements)||[]}

/* java course builders */
const JW=(...body)=>'public class Main {\n    public static void main(String[] args) {\n'+body.map(l=>'        '+l).join('\n')+'\n    }\n}';
const JM=(mth,...main)=>'public class Main {\n\n'+mth.split('\n').map(l=>'    '+l).join('\n')+'\n\n    public static void main(String[] args) {\n'+main.map(l=>'        '+l).join('\n')+'\n    }\n}';

async function signUp(name,email,pass){

    if(error){
      if(/already registered|already exists/i.test(error.message))return 'That email already has an account — try logging in.';

      DB.session=data.user.id;
      const nu=makeUser({id:data.user.id,name,email});DB.users.push(nu);save();
      return null;
    }
    return 'PENDING_CONFIRM'; // confirmation email is on
  }
  if(DB.users.some(u=>u.email.toLowerCase()===email.toLowerCase()))return 'That email already has an account — try logging in.';

      ?'Please confirm your email first — check your inbox.'

    FXx.save();FXx.translate(p.x,p.y);FXx.rotate(p.rot);FXx.globalAlpha=Math.min(1,p.life/34);FXx.fillStyle=p.c;

/* =====================================================================

===================================================================== */
function pyRange(a,b,c){
  let st=a,en=b,step=(c==null?1:c);
  if(b==null){st=0;en=a}
  const arr=[];
  if(step===0)throw new Error('range() step cannot be zero');
  for(let i=st;(step>0?i<en:i>en);i+=step){arr.push(i);if(arr.length>1000000)throw new Error('range is too large')}
  return arr;
}
function pyStr(v){
  if(Array.isArray(v))return '['+v.map(pyStr).join(', ')+']';
  if(typeof v==='boolean')return v?'True':'False';
  if(v==null||v===undefined)return 'None';
  return String(v);
}
function pyEq(a,b){
  if(Array.isArray(a)&&Array.isArray(b))return a.length===b.length&&a.every((x,i)=>pyEq(x,b[i]));
  return a===b;
}
function protectLine(s){
  const strs=[];
  const p=s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g,m=>{strs.push(m);return '\u0000'+(strs.length-1)+'\u0000'});
  return{p,restore:t=>t.replace(/\u0000(\d+)\u0000/g,(_,i)=>strs[+i])};
}
function fString(line){
  const tpl=inner=>'`'+inner.replace(/\{([^{}]+)\}/g,'\${$1}')+'`';
  return line.replace(/\bf"([^"\\]*)"/g,(m,i)=>tpl(i)).replace(/\bf'([^'\\]*)'/g,(m,i)=>tpl(i));
}
function convExprFull(code){
  return code
   .replace(/(\S+)\s+not\s+in\s+(\S+)/g,'!__in($1,$2)')
   .replace(/(\S+)\s+in\s+(\S+)/g,'__in($1,$2)')
   .replace(/\bprint\s*\(/g,'__print(')
   .replace(/\binput\s*\(/g,'__input(')
   .replace(/\.append\(/g,'.push(')
   .replace(/\.upper\(\)/g,'.toUpperCase()')
   .replace(/\.lower\(\)/g,'.toLowerCase()')
   .replace(/\.split\(\)/g,".split(' ')")
   .replace(/\bpass\b/g,'')
   .replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null')
   .replace(/\band\b/g,'&&').replace(/\bor\b/g,'||')
   .replace(/\bnot\b/g,'!');
}
function convHead(head){
  let m;
  if(m=/^def\s+([A-Za-z_]\w*)\s*\((.*)\)\s*$/.exec(head))return 'function '+m[1]+'('+m[2]+')';
  if(m=/^elif\s+(.+)$/.exec(head))return 'else if ('+convExprFull(m[1])+')';
  if(/^else\b/.test(head))return 'else';
  if(m=/^if\s+(.+)$/.exec(head))return 'if ('+convExprFull(m[1])+')';
  if(m=/^while\s+(.+)$/.exec(head))return 'while (__guard()&&('+convExprFull(m[1])+'))';
  if(m=/^for\s+(.+)$/.exec(head)){
    const mm=/^([A-Za-z_]\w*)\s+in\s+(.+)$/.exec(m[1]);
    if(mm)return 'for (let '+mm[1]+' of __iter('+convExprFull(mm[2])+'))';
    return convExprFull(m[1]);
  }
  if(/^(import|from|global|nonlocal)\b/.test(head))return ';';
  if(/^pass$/.test(head))return ';';
  return convExprFull(head);
}
function py2js(src){
  const lines=String(src).replace(/\r/g,'').replace(/\t/g,'    ').split('\n');
  const out=[],stack=[0];
  for(const raw of lines){
    if(!raw.trim()){out.push('');continue}
    const ind=(raw.match(/^ */)||[''])[0].length;
    const bodyRaw=raw.slice(ind);
    if(bodyRaw.trim().startsWith('#')){out.push('    '.repeat(Math.max(0,stack.length-1))+'//'+bodyRaw.trim().slice(1));continue}
    while(ind<stack[stack.length-1]){stack.pop();out.push('}')}
    if(ind>stack[stack.length-1])stack.push(ind);
    const{p,restore}=protectLine(fString(bodyRaw));
    let lineP=p.replace(/([\w\)\]])\s*\/\/\s*([\w\(])/g,'Math.floor($1/$2)');
    const cut=lineP.indexOf('#');
    if(cut>=0)lineP=lineP.slice(0,cut)+'//'+lineP.slice(cut+1);
    let depth=0,colon=-1;
    for(let i=0;i<lineP.length;i++){
      const ch=lineP[i];
      if(ch==='('||ch==='['||ch==='{')depth++;
      else if(ch===')'||ch===']'||ch==='}')depth--;
      else if(ch===':'&&depth===0){colon=i;break}
    }
    let head,body=null;
    if(colon>=0){head=lineP.slice(0,colon).trim();body=lineP.slice(colon+1).trim()}
    else head=lineP.trim();
    let js=convHead(head);
    if(/^(else|else\s+if)/.test(js)&&out.length&&out[out.length-1].trim()==='}'){out.pop();js='} '+js}
    if(colon>=0){js+=body?' { '+convExprFull(body).replace(/;*\s*$/,';')+' }':' {'}
    out.push(restore(js));
  }
  while(stack.length>1){stack.pop();out.push('}')}
  return out.join('\n');
}

    __iter:v=>{if(Array.isArray(v))return v;if(typeof v==='string')return v.split('');if(typeof v==='number')return pyRange(0,v);if(v&&typeof v==='object')return Object.keys(v);return []},

const JAVA_TYPES='(?:int|long|short|byte|double|float|boolean|char|String|var)';
function parseJavaMembers(rest){
  const members=[];let d=0,hs=0;
  for(let i=0;i<rest.length;i++){
    const ch=rest[i];
    if(ch==='"'||ch==="'"){const q=ch;i++;while(i<rest.length&&rest[i]!==q){if(rest[i]==='\\')i++;i++}continue}
    if(ch==='/'&&rest[i+1]==='/'){while(i<rest.length&&rest[i]!=='\n')i++;continue}
    if(ch==='/'&&rest[i+1]==='*'){i+=2;while(i<rest.length&&!(rest[i]==='*'&&rest[i+1]==='/'))i++;i++;continue}
    if(ch==='{'){if(d===0)members.push({header:rest.slice(hs,i).trim(),start:i+1});d++}
    else if(ch==='}'){d--;if(d===0&&members.length){const m=members[members.length-1];if(m.body===undefined)m.body=rest.slice(m.start,i);hs=i+1}}

function wrapLoop(t,kw){
  let i=0;
  while((i=t.indexOf(kw,i))>=0){
    if(i>0&&/[\w$]/.test(t[i-1])){i+=kw.length;continue}
    const j=t.indexOf('(',i);if(j<0)break;
    let d=0,k=j;
    for(;k<t.length;k++){const c=t[k];if(c==='(')d++;else if(c===')'){d--;if(d===0)break}}
    if(d!==0)break;

    if(kw==='for'){
      const p1=inner.indexOf(';');
      if(p1<0){i=k;continue}
      const p2=inner.indexOf(';',p1+1);
      if(p2<0){i=k;continue}
      const cond=inner.slice(p1+1,p2);
      if(!cond.trim()){i=k;continue}
      t=t.slice(0,j+1)+inner.slice(0,p1+1)+' __guard()&&('+cond+') '+inner.slice(p2)+t.slice(k);
    }else{
      if(!inner.trim()){i=k;continue}

function jBody(code){

  t=t.replace(/=\s*\{([^{}]*)\}/g,'= [$1]');
  t=t.replace(/\b(?:public|private|protected)\s+/g,'');
  t=t.replace(new RegExp('\\b'+JAVA_TYPES+'\\s+(?=[A-Za-z_$][\\w$]*\\s*(?:=|;|,|\\)))','g'),'');
  t=t.replace(/Integer\.parseInt\s*\(/g,'parseInt(').replace(/Double\.parseDouble\s*\(/g,'parseFloat(');
  t=t.replace(/String\.valueOf\s*\(/g,'String(');
  t=t.replace(/\.length\s*\(\s*\)/g,'.length');
  t=t.replace(/\((?:int|double|float|long)\)\s*/g,'');
  t=t.replace(/for\s*\(\s*[A-Za-z_$][\w$]*(?:\s*\[\s*\])?\s+(\w+)\s*:\s*([^)]+)\)/g,'for (let $1 of __iter($2))');
  t=wrapLoop(t,'while');t=wrapLoop(t,'for');
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>strs[+i]);
}
function java2js(src){
  const s=String(src||'').replace(/\r/g,'');
  const cls=/\bclass\s+\w+[^{]*\{/.exec(s);
  let body='',methods=[];
  if(cls){
    const members=parseJavaMembers(s.slice(cls.index+cls[0].length));
    for(const m of members){
      if(/static\s+void\s+main\s*\(/.test(m.header))body=m.body;
      else methods.push(m);
    }
    if(!body){const h=members.find(m=>!m.header);if(h)body=h.body}
  }else body=s;
  const defs=methods.map(m=>{
    const h=m.header.replace(/\s+/g,' ').trim();
    const mm=/(?:(?:public|private|protected)\s+)?(?:static\s+)?[\w\[\]]+\s+([A-Za-z_$][\w$]*)\s*\(([^)]*)\)\s*$/.exec(h);
    if(!mm)return'';
    const params=mm[2].split(',').map(p=>p.trim().split(/\s+/).pop()).filter(Boolean).join(',');
    return 'function '+mm[1]+'('+params+'){'+jBody(m.body)+'}';
  }).join('\n');
  return defs+'\n'+jBody(body);
}
function jStr(v){return Array.isArray(v)?'['+v.map(jStr).join(', ')+']':typeof v==='boolean'?(v?'true':'false'):String(v)}
function runJava(src,captures=[]){
  const logs=[];let steps=0;
  const guard=()=>{if(++steps>400000)throw new Error('your loop ran too long — check for an infinite loop');return true};
  const HJ={
    __print:(...a)=>logs.push(a.map(jStr).join(' ')),
    __iter:v=>Array.isArray(v)?v:(typeof v==='string'?v.split(''):[]),
  };
  let js;
  try{js=java2js(src)}catch(e){return{logs:[],env:{},err:'translation error: '+e.message}}
  const pre='if(!String.prototype.equals)String.prototype.equals=function(o){return String(this)===String(o)};';
  const cap=captures.map(n=>n+": (typeof "+n+"!=='undefined'?"+n+':undefined)').join(',');
  try{
    const f=new Function('__guard','__print','__iter',pre+js+'\n;return {'+cap+'};');
    return{logs,env:f(guard,HJ.__print,HJ.__iter)||{},err:null};
  }catch(e){return{logs,env:{},err:e.message}}
}
const runSrc=(code,lang)=>lang==='java'?runJava(code):runPy(code);
const show=v=>typeof v==='string'?JSON.stringify(v):pyStr(v);
function checkLesson(l,code){
  const lang=l.lang||l._lang||'py';
  const run=code2=>runSrc(code2,lang);
  if(!code||code.trim().length<3)return{ok:false,hint:'Write some code first — the editor is feeling lonely.'};
  const t=l.test;
  if(t){
    const caps=[...(t.fn?[t.fn]:[]),...(t.vars?Object.keys(t.vars):[])];
    const r=run(code,caps);
    if(r.err)return{ok:false,hint:(lang==='java'?'Java':'Python')+' hit an error: '+r.err};
    if(t.logs&&!r.logs.length)return{ok:false,hint:t.hint||'Your code ran, but nothing was printed — add a print.'};
    if(t.fn){
      const fn=r.env[t.fn];
      if(typeof fn!=='function')return{ok:false,hint:'Define a method called '+t.fn+' (check the spelling).'};
      for(const c of t.cases){
        let got;
        try{got=fn(...c.args)}catch(e){return{ok:false,hint:t.fn+'('+c.args.map(show).join(', ')+') crashed: '+e.message}}
        if(!pyEq(got,c.is))return{ok:false,hint:t.hint||(t.fn+'('+c.args.map(show).join(', ')+') returned '+show(got)+' but expected '+show(c.is)+'.')};
      }
      return{ok:true,logs:r.logs};
    }
    if(t.vars){
      for(const[name,chk]of Object.entries(t.vars)){
        if(!chk(r.env[name]))return{ok:false,hint:t.hint||('Check the variable "'+name+'".')};
      }
      return{ok:true,logs:r.logs};
    }
    return{ok:true,logs:r.logs};
  }
  const r=run(code);
  if(r.err)return{ok:false,hint:(lang==='java'?'Java':'Python')+' hit an error: '+r.err};
  return{ok:true,logs:r.logs};
}
function hl(code){
  return esc(code).replace(/(#[^\n]*|\/\/[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|\b(def|return|if|elif|else|for|while|in|and|or|not|True|False|None|import|from|class|pass|break|continue|print|range|len|lambda|is|type|str|int|float|public|private|protected|static|void|final|new|String|boolean|char|double|long|short|byte|System|out|true|false|null|this)\b|(\b\d+(?:\.\d+)?\b)/g,
    (m,cm,st,kw,nu)=>cm?`<span class="tk-cm">${cm}</span>`:st?`<span class="tk-st">${st}</span>`:kw?`<span class="tk-kw">${kw}</span>`:nu?`<span class="tk-nu">${nu}</span>`:m);
}

    $('#naGo').onclick=()=>{

        <button class="btn btn-pri" id="obGo" style="width:100%">${ic('rocket',16)} Enter Dashboard</button>`;
      $$('[data-av]',box).forEach(a=>a.onclick=()=>{av=+a.dataset.av;$$('[data-av]',box).forEach(x=>x.classList.toggle('sel',x===a))});
      $$('[data-like]',box).forEach(b=>b.onclick=()=>{const t=b.dataset.like;likes.has(t)?likes.delete(t):likes.add(t);b.classList.toggle('sel')});
      $$('[data-pref]',box).forEach(b=>b.onclick=()=>{pref=b.dataset.pref;$$('[data-pref]',box).forEach(x=>x.classList.toggle('sel',x===b))});
      const nx=$('#obNext',box);
      if(nx)nx.onclick=()=>{
        if(step===0)u.avatar=av;
        if(step===1&&!likes.size)return toast('Pick at least one topic','It shapes your first quest');
        step++;draw();};
      const bk=$('#obBack',box);if(bk)bk.onclick=()=>{step--;draw()};
      const go=$('#obGo',box);
      if(go)go.onclick=()=>{
        u.avatar=av;u.interests=[...likes];u.pref=pref;u.onboarded=true;save();
        confetti(200);later(()=>confetti(160),450);
        close();toast('Journey started','Request course access to begin your first lesson');
        location.hash='#/app/courses';};
    };
    draw();
  });
}
/* ---------- router ---------- */
function applyMotion(){document.body.classList.toggle('reduced',!!(user()&&user().prefs.reduceMotion))}
function render(){
  clearTimers();
  $$('.backdrop').forEach(b=>b.remove());
  const h=(location.hash||'#/').replace(/^#\/?/,'');
  const p=h.split('/');
  const u=user();applyMotion();
  if(p[0]==='app'){
    if(!u){location.hash='#/login';return}
    const sub=p[1]||'dashboard';
    const views={dashboard:vDashboard,courses:vCourses,'my-courses':vMyCourses,live:vLive,challenges:vChallenges,achievements:vAchievements,leaderboard:vLeaderboard,progress:vProgress,profile:vProfile,settings:vSettings,admin:vAdmin};
    (views[sub]||vDashboard)();
    if(sub==='course')vCourse(p[2]);
    if(sub==='lesson')vLesson(p[2],p[3],p[4]);
  }else if(p[0]==='login')vLogin();
  else if(p[0]==='signup')vSignup();
  else if(p[0]==='forgot')vForgot();
  else{if(u){location.hash='#/app/dashboard';return}vLanding()}
  window.scrollTo(0,0);
}
addEventListener('hashchange',render);
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height);
  const el=document.createElement('span');el.className='ripple';
  el.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  b.appendChild(el);setTimeout(()=>el.remove(),520);
});
(async()=>{await initDB();if(user())touchStreak();render();})();
</script>
</body>
